<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Summoner // Portal</title>
    <style>
        :root {
            --mythic: #ff3b30;
            --legendary: #00d2ff;
            --epic: #af52de;
            --rare: #34c759;
            --dark-bg: #05070a;
        }

        body {
            background-color: var(--dark-bg);
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        /* SCREEN ACTIONS */
        .shake { animation: screenShake 0.4s infinite; }
        .glitch { animation: uiGlitch 0.1s infinite; }
        .darken { background-color: #000 !important; transition: background 0.3s ease; }

        @keyframes screenShake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes uiGlitch {
            0% { opacity: 0.9; transform: skewX(0deg); filter: hue-rotate(0deg); }
            50% { opacity: 0.3; transform: skewX(5deg); filter: hue-rotate(90deg); }
            100% { opacity: 0.9; transform: skewX(0deg); filter: hue-rotate(0deg); }
        }

        /* LAYOUT */
        #portal-container {
            width: 90%;
            max-width: 950px;
            height: 85vh;
            background: linear-gradient(145deg, #0b0f19, #070a10);
            border: 2px solid #1e293b;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: all 0.5s ease;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .currency { color: #ffd700; font-weight: bold; }

        /* THE DISPLAY MANIFESTATION STAGE */
        #display-stage {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            border: 1px dashed #1e293b;
            padding: 20px;
            text-align: center;
        }

        /* SPECIAL EFFECT OVERLAYS */
        #fx-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            z-index: 10;
        }

        #hero-card {
            max-width: 600px;
            opacity: 1;
            transition: opacity 0.2s ease;
        }

        .rarity-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .name-txt { font-size: 2.2rem; font-weight: bold; margin: 5px 0; text-shadow: 0 0 10px rgba(255,255,255,0.1); }
        .title-txt { font-size: 1.1rem; color: #94a3b8; font-style: italic; margin-bottom: 20px; }
        
        .spin-box { 
            background: rgba(255,255,255,0.03); 
            border-left: 3px solid #64748b; 
            padding: 12px; 
            margin: 15px 0; 
            font-size: 0.95rem;
            text-align: left;
            line-height: 1.4;
        }
        
        .playstyle-box {
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: left;
            line-height: 1.5;
            border: 1px solid #1e293b;
        }

        /* CONTROLS */
        #control-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-top: 10px;
        }

        .summon-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 15px 35px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .summon-btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            border-color: #ffd700;
        }

        .summon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #1e293b;
            color: #64748b;
        }
    </style>
</head>
<body>

<div id="portal-container">
    <div id="top-bar">
        <div>SUMMON GATEWAY // READY</div>
        <div>Crystals: <span id="crystal-count" class="currency">2,500</span></div>
        <div>Pity Tracker: <span id="pity-count" style="color: #ffaa00;">0/50</span></div>
    </div>

    <div id="display-stage">
        <div id="fx-overlay"></div>
        <div id="hero-card">
            <div style="font-size: 4rem; margin-bottom: 20px;">🌌</div>
            <div class="name-txt">The Void Awaits</div>
            <div class="title-txt">Spend 50 Crystals to interface with the timeline.</div>
        </div>
    </div>

    <div id="control-panel">
        <button class="summon-btn" id="roll-btn" onclick="triggerSummon()">CONVERGE TIMELINE (-50 Crystals)</button>
    </div>
</div>

<script>
    // THE MANIFEST STRUCTURE DATA
    const masterRoster = {
        mythic: [
            { name: "Prime Pleth", title: "The Unbound Successor", rank: 1, spin: "Slouched in his hoodie chewing a popsicle; when selected, the screen violently shakes, a massive golden black hole ring flares, and black roses explode from the floor.", playstyle: "Gravity Juggernaut / Map Control. Manipulates physics to drag all enemies on screen toward him, crushing them with planet-tier gravity fields while blooming black roses that life-steal over time.", fx: "blackhole" },
            { name: "The Masked Leader", title: "The Void Tyrant", rank: 2, spin: "Hovering in a vortex of liquid ash, his cracked porcelain mask bleeding dark energy. When selected, shadow claws slash the screen, glitching the UI.", playstyle: "Void Sorcerer / Health Drain. Sets up shadow traps that root enemies in place. He inflicts high damage-over-time and absorbs the enemy's HP bar to fuel his desperate, high-damage final strikes.", fx: "glitch" },
            { name: "Osiris", title: "The Ancient Arbitrator", rank: 3, spin: "A legendary blind deity floating cross-legged between glowing golden scales. When selected, the scales tilt, and time visually slows down on screen.", playstyle: "Reality-Warper / Support. Can literally pause or slow down the game clock for enemies, reverse recent damage taken by allies, or swap his team's debuffs onto the opposing squad.", fx: "timeslow" },
            { name: "Malakor", title: "The Death God's Left Hand", rank: 4, spin: "A towering skeletal figure in bone armor. When selected, he slams a massive scythe down, causing pitch-black roses to bloom and wither instantly.", playstyle: "Execute / Long-Range Bruiser. Cleaves through multiple enemies at once with a massive scythe. Deals extra execution damage to enemies below 30% health and revives fallen allies as shadow skeletons.", fx: "scythe" }
        ],
        legendary: [
            { name: "Lykos", title: "The Traitor’s Edge", rank: 5, spin: "Tossing a twin-pronged dagger in the dark. Selected: steps into the light with a cold, bored stare and draws a blade that absorbs all ambient light.", playstyle: "Shadow Assassin / Burst Damage. High-speed teleportation. He marks targets from the shadows, jumps directly behind them, and unloads massive critical-strike burst damage before slipping away.", fx: "darkness" },
            { name: "Nix", title: "The Underworld Vanguard", rank: 6, spin: "Pleth’s older sibling sitting on a floating throne of dark stone. Selected: steps off, unleashing a wave of freezing blue underworld flame.", playstyle: "Elemental Mage / Crowd Control. Fires tracking waves of blue underworld fire that leaves a freezing trail on the ground, slowing enemy movement down to an absolute crawl.", fx: "bluefire" },
            { name: "Vane", title: "The Iron Headmaster", rank: 7, spin: "Stiffly standing in a formal academy coat with eyes closed. Selected: opens his glowing eyes, snapping ancient runic barriers into existence.", playstyle: "Defensive Tactician / Buffer. Drops stationary runic fields that block all enemy projectiles while boosting the attack power and defense stats of any ally standing inside them.", fx: "runes" },
            { name: "Erebus", title: "The Shadow General", rank: 8, spin: "A mass of shifting, liquid shadows that instantly hardens into heavy dark plate armor when selected, drawing twin obsidian maces.", playstyle: "Berserker / Vanguard. A heavy brawler who loses defense armor as his health drops, but gains massive attack speed and raw damage the closer he gets to dying.", fx: "shadows" },
            { name: "Zephyr", title: "The Void Horizon", rank: 9, spin: "A legendary space-time wanderer cloaked in tattered cosmic wraps. Selected: taps his staff, causing the background stars to warp and pull toward him.", playstyle: "Mobility Skirmisher / Teleporter. Can open mini-wormholes on the field to instantaneously reposition your entire party, dodging ultimate attacks effortlessly.", fx: "warp" },
            { name: "Selene", title: "The Eclipse Empress", rank: 10, spin: "Levitating with a crescent blade floating behind her back. Selected: her eyes turn solid black, and a total solar eclipse darkens the screen.", playstyle: "Debuffer / Blindness. Blinds the enemy team by plunging the battlefield into an eclipse, causing their attacks to miss while she lands un-dodgeable tracking strikes.", fx: "eclipse" }
        ],
        epic: [
            { name: "Sterling", title: "The Ruby-Tier Gilt", rank: 11, spin: "Flexing in flawless white-and-gold armor. Selected: draws a glowing rapier and strikes an arrogant, stiff fencing salute.", playstyle: "Precision Duelist / Counter-Striker. Relies on perfectly-timed parries. When he successfully blocks an attack, he unleashes a lightning-fast rapier combo that breaks enemy shields.", fx: "flash" },
            { name: "Kora", title: "The Unbroken Aegis", rank: 12, spin: "Leaning on the hilt of a massive iron greatsword buried in the dirt. Selected: hoists it onto her shoulders with a fierce, ready-to-scrap smirk.", playstyle: "Frontline Tank / Disrupter. Absorbs massive punishment using hyper-armor frames. She slams her greatsword into the earth to cause AOE knockbacks, keeping enemies off your squishy mages.", fx: "impact" },
            { name: "Valen", title: "The Paragon Senior", rank: 13, spin: "Doing one-handed pushups before flipping up. Selected: wraps his fists in a glowing aura and takes a textbook martial arts stance.", playstyle: "Combo Striker / Brawler. High-speed, fluid martial arts. He chains punches and kicks together to build up a combo meter, unleashing a devastating aura-blast at max stacks.", fx: "aura" },
            { name: "Jaxon", title: "The Rogue Mercenary", rank: 14, spin: "Sitting on an ammo crate cleaning a high-tech rifle. Selected: stands up and aims it right at the screen with a wild, lawless grin.", playstyle: "Long-Range Marksman / Sniper. Keeps his distance at the back of the map, dealing heavy single-target damage with a high-velocity rifle and dropping explosive landmines to stop rushdown enemies.", fx: "crosshair" },
            { name: "Orion", title: "The Star-Forged Blacksmith", rank: 15, spin: "Hammering a glowing piece of cosmic ore on an anvil. Selected: lifts a heavy, burning magma hammer and slams it down, sending sparks flying.", playstyle: "Item Enchanter / Fire Bruiser. Slams his burning magma hammer down to deal fire damage while permanently upgrading his teammates' weapons mid-battle.", fx: "sparks" },
            { name: "Lyra", title: "The Sound-Wave Siren", rank: 16, spin: "Floating gently while tuning a crystal harp. Selected: strikes a chord that sends a visible, destructive kinetic shockwave ripping across the grass.", playstyle: "Kinetic Zoner / Healer. Uses musical soundwaves to push enemies away from her while simultaneously pulse-healing her allies with every rhythm chord struck.", fx: "wave" }
        ],
        rare: [
            { name: "Leo", title: "The Eager Vanguard", rank: 17, spin: "Pleth's number-one fan trying way too hard to mimic his stance. Selected: accidentally trips over his own wooden practice sword but scrambles up quickly.", playstyle: "Basic Balanced Attacker. Standard, easy-to-learn sword combos. Good for beginners, with balanced attack and defense stats but no crazy supernatural perks.", fx: "none" },
            { name: "Iris", title: "The Sparks of the Future", rank: 18, spin: "The young academy girl looking around nervously. Selected: squares her shoulders, pulls out a practice dagger, and takes a low-gravity stance.", playstyle: "Evasion / Speed Scout. Low damage per hit, but boasts incredibly fast movement speed. Perfect for running around traps and quickly dodging lethal boss attacks.", fx: "none" },
            { name: "Toby", title: "The Clumsy Squire", rank: 19, spin: "Carrying a massive bundle of practice gear and popsicle sticks. Selected: drops half of them, salutes awkwardly, and draws a short-sword.", playstyle: "RNG Support / Utility. Clumsily throws items at random. He might accidentally drop a healing popsicle for your team, or trip and hurl a smoke bomb that confuses the enemy.", fx: "none" },
            { name: "Shade", title: "The Rogue Grunt", rank: 20, spin: "A low-level shadow scout hiding under a dark hood. Selected: pulls out two basic iron daggers, his red eyes glowing faintly from the darkness.", playstyle: "Basic Dual-Wielder. Fast, low-damage dagger slashes. Weak health pool, but builds up a fast attack rhythm to clear out weak enemy minions.", fx: "none" }
        ]
    };

    let userState = {
        crystals: 2500,
        pity: 0
    };

    function triggerSummon() {
        if (userState.crystals < 50) return;

        userState.crystals -= 50;
        userState.pity += 1;
        document.getElementById("crystal-count").innerText = userState.crystals.toLocaleString();
        document.getElementById("pity-count").innerText = `${userState.pity}/50`;

        const rollBtn = document.getElementById("roll-btn");
        rollBtn.disabled = true;

        // Clear previous visual states completely
        const container = document.getElementById("portal-container");
        const stage = document.getElementById("display-stage");
        const fxOverlay = document.getElementById("fx-overlay");
        const card = document.getElementById("hero-card");
        
        container.className = "";
        stage.className = "";
        fxOverlay.innerText = "";
        card.style.opacity = "0";

        // Determine Rarity Block
        let chosenRarity = "rare";
        const diceRoll = Math.random() * 100;

        // 50-pull Hard Pity check for safety
        if (userState.pity >= 50) {
            chosenRarity = "mythic";
            userState.pity = 0;
        } else if (diceRoll <= 0.5) {
            chosenRarity = "mythic";
            userState.pity = 0; 
        } else if (diceRoll <= 3.0) { // 0.5 + 2.5
            chosenRarity = "legendary";
        } else if (diceRoll <= 15.0) { // 3.0 + 12.0
            chosenRarity = "epic";
        }

        // Pull entity from database
        const targetPool = masterRoster[chosenRarity];
        const character = targetPool[Math.floor(Math.random() * targetPool.length)];

        // Run Cinematic Presentation Sequence
        setTimeout(() => {
            renderCinematicFX(character.fx, container, fxOverlay);
            
            // Render the text metrics onto card UI
            card.innerHTML = `
                <span class="rarity-badge" style="background-color: var(--${chosenRarity}); color: #000;">${chosenRarity} (Rank #${character.rank})</span>
                <div class="name-txt" style="color: var(--${chosenRarity})">${character.name}</div>
                <div class="title-txt">"${character.title}"</div>
                <div class="spin-box"><strong>The Spin:</strong> ${character.spin}</div>
                <div class="playstyle-box"><strong>Playstyle Strategy:</strong> ${character.playstyle}</div>
            `;
            card.style.opacity = "1";
            rollBtn.disabled = false;
        }, 600);
    }

    function renderCinematicFX(fxType, container, overlay) {
        if (fxType === "blackhole") {
            container.classList.add("shake");
            overlay.innerText = "🌌🌀🌹";
            setTimeout(() => container.classList.remove("shake"), 1200);
        } else if (fxType === "glitch") {
            container.classList.add("glitch");
            overlay.innerText = "👁️⛓️💀";
            setTimeout(() => container.classList.remove("glitch"), 1000);
        } else if (fxType === "timeslow") {
            overlay.innerText = "⏳⚖️✨";
            document.getElementById("display-stage").style.transition = "all 2s ease";
            document.getElementById("display-stage").style.filter = "sepia(0.8) contrast(1.2)";
            setTimeout(() => { document.getElementById("display-stage").style.filter = "none"; }, 2000);
        } else if (fxType === "scythe") {
            container.classList.add("shake");
            overlay.innerText = "⚔️🥀💀";
            setTimeout(() => container.classList.remove("shake"), 600);
        } else if (fxType === "darkness" || fxType === "eclipse") {
            container.classList.add("darken");
            overlay.innerText = "🌒🗡️👁️";
            setTimeout(() => container.classList.remove("darken"), 1500);
        } else if (fxType === "bluefire") {
            overlay.innerText = "🔥🔷❄️";
        } else if (fxType === "runes") {
            overlay.innerText = "🛡️🔱💠";
        } else if (fxType === "warp") {
            overlay.innerText = "🌀💫🌌";
        } else if (fxType === "flash" || fxType === "aura" || fxType === "impact") {
            overlay.innerText = "⚡🌟👊";
        } else if (fxType === "crosshair" || fxType === "sparks" || fxType === "wave") {
            overlay.innerText = "🎯🔨🎵";
        }
    }
</script>

</body>
</html>
