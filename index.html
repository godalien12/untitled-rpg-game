<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Summoner // Cinematic Portal</title>
    <style>
        :root {
            --mythic: #ff3b30;
            --legendary: #00d2ff;
            --epic: #af52de;
            --rare: #34c759;
            --dark-bg: #05070a;
        }

        body {
            background-color: var(--dark-bg);
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        #portal-container {
            width: 90%;
            max-width: 950px;
            height: 85vh;
            background: linear-gradient(145deg, #0b0f19, #070a10);
            border: 2px solid #1e293b;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            z-index: 5;
        }

        .currency { color: #ffd700; font-weight: bold; }

        #display-stage {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 1px solid #1e293b;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }

        #hero-card {
            max-width: 600px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 4;
        }

        .rarity-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .name-txt { font-size: 2.2rem; font-weight: bold; margin: 5px 0; }
        .title-txt { font-size: 1.1rem; color: #94a3b8; font-style: italic; margin-bottom: 20px; }
        
        .spin-box { 
            background: rgba(255,255,255,0.03); 
            border-left: 3px solid #64748b; 
            padding: 12px; 
            margin: 15px 0; 
            font-size: 0.95rem;
            text-align: left;
        }
        
        .playstyle-box {
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: left;
            border: 1px solid #1e293b;
        }

        #control-panel {
            display: flex;
            justify-content: center;
            z-index: 5;
        }

        .summon-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 15px 35px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .summon-btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            border-color: #ffd700;
        }

        /* ==========================================================================
           ADVANCED CINEMATIC GRAPHICS ENGINES (CSS KEYFRAMES)
           ========================================================================== */
        
        /* SCREEN ACTION INTERFACES */
        .fx-shake { animation: masterShake 0.4s infinite; }
        .fx-glitch { animation: masterGlitch 0.15s infinite; }
        
        @keyframes masterShake {
            0% { transform: translate(3px, 2px) rotate(0deg); }
            20% { transform: translate(-3px, -1px) rotate(-1deg); }
            40% { transform: translate(-1px, -2px) rotate(1deg); }
            60% { transform: translate(2px, 2px) rotate(0deg); }
            80% { transform: translate(-2px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -1px) rotate(1deg); }
        }

        @keyframes masterGlitch {
            0% { transform: skew(0deg); filter: hue-rotate(0deg) contrast(1); }
            20% { transform: skew(4deg) translate(5px, -2px); filter: hue-rotate(90deg) contrast(1.5); }
            40% { transform: skew(-3deg); filter: invert(0.1); }
            60% { transform: skew(1deg) translate(-5px, 2px); filter: hue-rotate(180deg); }
            80% { transform: skew(-5deg); opacity: 0.7; }
            100% { transform: skew(0deg); filter: hue-rotate(360deg); }
        }

        /* DYNAMIC EFFECT ELEMENT LAYERS */
        .vfx-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 1. PRIME PLETH: GOLDEN BLACK HOLE RING */
        .blackhole-ring {
            width: 10px; height: 10px;
            border: 4px solid #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 40px #ff3b30, inset 0 0 40px #000;
            background: #000;
            animation: blackholeExpand 1.5s forwards cubic-bezier(0.075, 0.82, 0.165, 1);
        }
        @keyframes blackholeExpand {
            0% { transform: scale(1); opacity: 0; border-width: 20px; }
            30% { opacity: 1; }
            60% { transform: scale(40); border-width: 2px; background: rgba(0,0,0,0.9); }
            100% { transform: scale(80); opacity: 0; }
        }

        /* 2. THE MASKED LEADER: SHADOW CLAWD SLASHES */
        .shadow-slash {
            position: absolute;
            width: 150%; height: 20px;
            background: linear-gradient(90deg, transparent, #000, #ff3b30, #000, transparent);
            transform: rotate(-35deg) translateY(-300px);
            box-shadow: 0 0 20px #ff3b30;
            animation: slashCut 0.4s forwards ease-in-out;
        }
        .slash-2 { transform: rotate(45deg) translateY(300px); animation-delay: 0.15s; }
        @keyframes slashCut {
            0% { transform: rotate(-35deg) translate(-100%, -200px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: rotate(-35deg) translate(100%, 200px); opacity: 0; }
        }

        /* 3. OSIRIS: GOLDEN SCALES TIME SLOW */
        .time-slow-wave {
            width: 100%; height: 100%;
            background: rgba(255, 215, 0, 0.15);
            filter: sepia(1) blur(2px);
            animation: timeWarp 2s forwards ease-out;
        }
        @keyframes timeWarp {
            0% { opacity: 0; filter: blur(20px) sepia(1); }
            20% { opacity: 1; filter: blur(0px) sepia(1); }
            80% { opacity: 1; filter: blur(0px) sepia(0.5); }
            100% { opacity: 0; filter: blur(10px) sepia(0); }
        }

        /* 4. MALAKOR: DEATH SCythe SWEEP */
        .scythe-sweep {
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, #222 50%, #000 70%);
            animation: scytheCleave 0.8s forwards ease-out;
        }
        @keyframes scytheCleave {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: scale(3) rotate(180deg); opacity: 0; }
        }

        /* 5. LYKOS: LIGHT ABSORPTION DARKNESS */
        .light-snatch {
            width: 100%; height: 100%;
            background: #000;
            animation: absoluteDark 1.4s forwards ease-in-out;
        }
        @keyframes absoluteDark {
            0% { opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* GENERAL FLASH OVERLAYS FOR HIGH TIERS */
        .tier-flash {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
            animation: flashBurst 0.5s forwards ease-out;
        }
        @keyframes flashBurst {
            0% { background: #fff; opacity: 1; }
            100% { background: transparent; opacity: 0; }
        }
    </style>
</head>
<body>

<div id="portal-container">
    <div id="top-bar">
        <div>CONVERGENCE GATEWAY // AUDIO-VISUAL CORE ONLINE</div>
        <div>Crystals: <span id="crystal-count" class="currency">2,500</span></div>
        <div>Pity: <span id="pity-count" style="color: #ffaa00;">0/50</span></div>
    </div>

    <div id="display-stage">
        <!-- Renders graphical animation structures here dynamically -->
        <div id="vfx-container" class="vfx-layer"></div>
        
        <div id="hero-card">
            <div style="font-size: 4rem; margin-bottom: 20px;">🌌</div>
            <div class="name-txt">The Gate is Sealed</div>
            <div class="title-txt">Interface with the terminal to summon your roster units.</div>
        </div>
    </div>

    <div id="control-panel">
        <button class="summon-btn" id="roll-btn" onclick="triggerSummon()">CONVERGE TIMELINE (-50 Crystals)</button>
    </div>
</div>

<script>
    const masterRoster = {
        mythic: [
            { name: "Prime Pleth", title: "The Unbound Successor", rank: 1, spin: "Slouched in his hoodie chewing a popsicle; when selected, the screen violently shakes, a massive golden black hole ring flares, and black roses explode from the floor.", playstyle: "Gravity Juggernaut / Map Control. Manipulates physics to drag all enemies on screen toward him, crushing them with planet-tier gravity fields while blooming black roses that life-steal over time.", fx: "blackhole" },
            { name: "The Masked Leader", title: "The Void Tyrant", rank: 2, spin: "Hovering in a vortex of liquid ash, his cracked porcelain mask bleeding dark energy. When selected, shadow claws slash the screen, glitching the UI.", playstyle: "Void Sorcerer / Health Drain. Sets up shadow traps that root enemies in place. He inflicts high damage-over-time and absorbs the enemy's HP bar to fuel his desperate, high-damage final strikes.", fx: "glitch" },
            { name: "Osiris", title: "The Ancient Arbitrator", rank: 3, spin: "A legendary blind deity floating cross-legged between glowing golden scales. When selected, the scales tilt, and time visually slows down on screen.", playstyle: "Reality-Warper / Support. Can literally pause or slow down the game clock for enemies, reverse recent damage taken by allies, or swap his team's debuffs onto the opposing squad.", fx: "timeslow" },
            { name: "Malakor", title: "The Death God's Left Hand", rank: 4, spin: "A towering skeletal figure in bone armor. When selected, he slams a massive scythe down, causing pitch-black roses to bloom and wither instantly.", playstyle: "Execute / Long-Range Bruiser. Cleaves through multiple enemies at once with a massive scythe. Deals extra execution damage to enemies below 30% health and revives fallen allies as shadow skeletons.", fx: "scythe" }
        ],
        legendary: [
            { name: "Lykos", title: "The Traitor’s Edge", rank: 5, spin: "Tossing a twin-pronged dagger in the dark. Selected: steps into the light with a cold, bored stare and draws a blade that absorbs all ambient light.", playstyle: "Shadow Assassin / Burst Damage. High-speed teleportation. He marks targets from the shadows, jumps directly behind them, and unloads massive critical-strike burst damage before slipping away.", fx: "darkness" },
            { name: "Nix", title: "The Underworld Vanguard", rank: 6, spin: "Pleth’s older sibling sitting on a floating throne of dark stone. Selected: steps off, unleashing a wave of freezing blue underworld flame.", playstyle: "Elemental Mage / Crowd Control. Fires tracking waves of blue underworld fire that leaves a freezing trail on the ground, slowing enemy movement down to an absolute crawl.", fx: "bluefire" }
        ],
        epic: [
            { name: "Sterling", title: "The Ruby-Tier Gilt", rank: 11, spin: "Flexing in flawless white-and-gold armor. Selected: draws a glowing rapier and strikes an arrogant, stiff fencing salute.", playstyle: "Precision Duelist / Counter-Striker. Relies on perfectly-timed parries. When he successfully blocks an attack, he unleashes a lightning-fast rapier combo that breaks enemy shields.", fx: "flash" },
            { name: "Kora", title: "The Unbroken Aegis", rank: 12, spin: "Leaning on the hilt of a massive iron greatsword buried in the dirt. Selected: hoists it onto her shoulders with a fierce, ready-to-scrap smirk.", playstyle: "Frontline Tank / Disrupter. Absorbs massive punishment using hyper-armor frames. She slams her greatsword into the earth to cause AOE knockbacks, keeping enemies off your squishy mages.", fx: "flash" }
        ],
        rare: [
            { name: "Leo", title: "The Eager Vanguard", rank: 17, spin: "Pleth's number-one fan trying way too hard to mimic his stance. Selected: accidentally trips over his own wooden practice sword but scrambles up quickly.", playstyle: "Basic Balanced Attacker. Standard, easy-to-learn sword combos.", fx: "none" },
            { name: "Toby", title: "The Clumsy Squire", rank: 19, spin: "Carrying a massive bundle of practice gear and popsicle sticks. Selected: drops half of them, salutes awkwardly, and draws a short-sword.", playstyle: "RNG Support / Utility.", fx: "none" }
        ]
    };

    let userState = { crystals: 2500, pity: 0 };

    function triggerSummon() {
        if (userState.crystals < 50) return;

        userState.crystals -= 50;
        userState.pity += 1;
        document.getElementById("crystal-count").innerText = userState.crystals.toLocaleString();
        document.getElementById("pity-count").innerText = `${userState.pity}/50`;

        const rollBtn = document.getElementById("roll-btn");
        const container = document.getElementById("portal-container");
        const vfxContainer = document.getElementById("vfx-container");
        const card = document.getElementById("hero-card");
        
        rollBtn.disabled = true;
        card.style.opacity = "0";
        card.style.transform = "scale(0.8)";
        
        // Wipe styles completely
        container.className = "";
        vfxContainer.innerHTML = "";

        // Core Random Generation Percentile Check
        let chosenRarity = "rare";
        const diceRoll = Math.random() * 100;

        if (userState.pity >= 50) {
            chosenRarity = "mythic";
            userState.pity = 0;
        } else if (diceRoll <= 0.5) {
            chosenRarity = "mythic";
            userState.pity = 0; 
        } else if (diceRoll <= 3.0) {
            chosenRarity = "legendary";
        } else if (diceRoll <= 15.0) {
            chosenRarity = "epic";
        }

        const pool = masterRoster[chosenRarity];
        const character = pool[Math.floor(Math.random() * pool.length)];

        // Run Engine Graphics Dispatcher
        executeCinematics(character.fx, container, vfxContainer);

        // Bring the character manifest frame into sight after the blast clears
        setTimeout(() => {
            card.innerHTML = `
                <span class="rarity-badge" style="background-color: var(--${chosenRarity}); color: #000;">${chosenRarity} // Rank #${character.rank}</span>
                <div class="name-txt" style="color: var(--${chosenRarity})">${character.name}</div>
                <div class="title-txt">"${character.title}"</div>
                <div class="spin-box"><strong>The Spin Presentation:</strong> ${character.spin}</div>
                <div class="playstyle-box"><strong>Combat Strategy:</strong> ${character.playstyle}</div>
            `;
            card.style.opacity = "1";
            card.style.transform = "scale(1)";
            rollBtn.disabled = false;
        }, 1000);
    }

    function executeCinematics(fx, container, vfx) {
        // High Tier Shock Flash
        if (fx !== "none") {
            const flash = document.createElement("div");
            flash.classList.add("tier-flash");
            document.getElementById("display-stage").appendChild(flash);
            setTimeout(() => flash.remove(), 500);
        }

        // Specific Lore Profiles Dispatcher
        if (fx === "blackhole") {
            container.classList.add("fx-shake");
            const element = document.createElement("div");
            element.classList.add("blackhole-ring");
            vfx.appendChild(element);
            setTimeout(() => container.classList.remove("fx-shake"), 1500);
            
        } else if (fx === "glitch") {
            container.classList.add("fx-glitch");
            const slash1 = document.createElement("div");
            slash1.classList.add("shadow-slash");
            const slash2 = document.createElement("div");
            slash2.classList.add("shadow-slash", "slash-2");
            vfx.appendChild(slash1);
            vfx.appendChild(slash2);
            setTimeout(() => container.classList.remove("fx-glitch"), 1200);
            
        } else if (fx === "timeslow") {
            const element = document.createElement("div");
            element.classList.add("time-slow-wave");
            vfx.appendChild(element);
            
        } else if (fx === "scythe") {
            container.classList.add("fx-shake");
            const element = document.createElement("div");
            element.classList.add("scythe-sweep");
            vfx.appendChild(element);
            setTimeout(() => container.classList.remove("fx-shake"), 800);
            
        } else if (fx === "darkness") {
            const element = document.createElement("div");
            element.classList.add("light-snatch");
            vfx.appendChild(element);
        }
    }
</script>

</body>
</html>
